name: Modernisation Platform Restart Service
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to restart Jitbit in'
        required: true
        default: 'development'
        type: choice
        options:
        - sandbox
        - development
        - test
        - preproduction
        - production
      colours_to_restart:
        description: 'Which colour(s) to restart in a Blue/Green deployment environment.'
        required: false
        default: 'not applicable'
        type: choice
        options:
          - blue
          - green
          - "blue & green"
          - "not applicable"

env:
  BLUE_GREEN_ENVS: '["sandbox", "development", "test"]'

jobs:
  restart-jitbit:
    name: Restart Jitbit - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: service/cluster string
        run: |
            if [ "${{ inputs.environment }}" = "sandbox" ]; then
              echo "CLUSTER_SERVICE_NAME=hmpps-development-delius-jitbit-${{ inputs.environment }}" >> $GITHUB_ENV
            else
              echo "CLUSTER_SERVICE_NAME=hmpps-${{ inputs.environment }}-delius-jitbit" >> $GITHUB_ENV
            fi
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/modernisation-platform-oidc-cicd"
          role-session-name: "hmpps-cr-ancillary-jitbit-app-${{ github.run_number }}"
          aws-region: "eu-west-2"

      - name: Restart Jitbit (Env with NO Blue/Green deployment solution)
        if: ${{ !contains(fromJson(env.BLUE_GREEN_ENVS), inputs.environment) }}
        run: |
          aws ecs update-service --force-new-deployment --service ${CLUSTER_SERVICE_NAME} --cluster ${CLUSTER_SERVICE_NAME}
      
      - name: Ensure service stable (Env with NO Blue/Green deployment solution)
        if: ${{ !contains(fromJson(env.BLUE_GREEN_ENVS), inputs.environment) }}
        run: |
          aws ecs wait services-stable --services ${CLUSTER_SERVICE_NAME} --cluster ${CLUSTER_SERVICE_NAME}
      
      - name: Restart Jitbit (Blue)
        if: ${{ contains(fromJson(env.BLUE_GREEN_ENVS), inputs.environment) && (inputs.colours_to_restart == 'blue' || inputs.colours_to_restart == 'both') }}
        run: |
          aws ecs update-service --force-new-deployment --service ${CLUSTER_SERVICE_NAME} --cluster ${CLUSTER_SERVICE_NAME}
      
      - name: Ensure service stable (Green)
        if: ${{ contains(fromJson(env.BLUE_GREEN_ENVS), inputs.environment) && (inputs.colours_to_restart == 'green' || inputs.colours_to_restart == 'both') }}
        run: |
          aws ecs wait services-stable --services ${CLUSTER_SERVICE_NAME} --cluster ${CLUSTER_SERVICE_NAME}
