name: Deploy to all environments
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, closed]

jobs:
  deploy:
    uses: ./.github/workflows/jitbit-deploy-environment-reusable.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: sandbox
            blue_image_tag: 11.23.8-latest
            green_image_tag: 11.22.19-latest
            active_deployment_colour: blue

          - environment: development
            blue_image_tag:
            green_image_tag: 11.22.19-latest
            active_deployment_colour: green

          - environment: test
            blue_image_tag: 11.22.17-latest
            green_image_tag: 11.20.10-latest
            active_deployment_colour: blue

          - environment: preproduction
            blue_image_tag: 11.22.19-latest
            green_image_tag:
            active_deployment_colour: blue

          - environment: production
            blue_image_tag: 11.22.19-latest
            green_image_tag:
            active_deployment_colour: blue
            
    with:
      environment: ${{ matrix.environment }}
      blue_image_tag: ${{ matrix.blue_image_tag || '' }}
      green_image_tag: ${{ matrix.green_image_tag || '' }}
      active_deployment_colour: ${{ matrix.active_deployment_colour || '' }}
    secrets: inherit
